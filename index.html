<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BREAK & GROW ROGUE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:#06101c;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;
}
body{position:fixed;inset:0}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:linear-gradient(#0b1830,#06101c)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#07111d}
#hud{position:absolute;z-index:5;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));pointer-events:none}
.hudbox{display:flex;flex-wrap:wrap;gap:7px 12px;background:rgba(5,10,20,.74);border:1px solid #294166;border-radius:12px;padding:8px 10px;font-size:12px;backdrop-filter:blur(5px)}
.bar{height:7px;background:#101a2b;border-radius:999px;overflow:hidden;margin-top:5px}
#hpbar{background:linear-gradient(90deg,#52ec8d,#b9ff77);height:100%}
#xpbar{background:linear-gradient(90deg,#ffd457,#fff3a8);height:100%}
#bottom{
  position:absolute;z-index:6;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;pointer-events:none
}
.panel{background:rgba(5,10,20,.72);border:1px solid #294166;border-radius:12px;padding:8px 10px;backdrop-filter:blur(5px);pointer-events:auto}
label{font-size:11px;color:#b7c5df;display:flex;justify-content:space-between;gap:8px}
input[type=range]{width:160px}
button{border:0;border-radius:12px;padding:12px 14px;background:#2f9158;color:white;font-weight:900;font-size:14px}
#upgrade{
  position:absolute;z-index:20;inset:0;background:rgba(2,6,13,.82);display:none;align-items:center;justify-content:center;padding:18px;
  touch-action:none;
}
#upgrade.show{display:flex}
.modal{width:min(520px,94vw);background:#10192b;border:1px solid #34517f;border-radius:18px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.modal h2{margin:0 0 4px;font-size:26px}.modal p{margin:0 0 12px;color:#9eb0d4;font-size:13px}
.choices{display:grid;gap:10px}
.choice{background:#162540;border:1px solid #37598d;border-radius:14px;padding:14px;text-align:left}
.choice b{display:block;font-size:18px;margin-bottom:4px}.choice span{font-size:13px;color:#c4d3f0}
#startOverlay{
  position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,8,16,.72)
}
.startCard{width:min(430px,90vw);background:#10192b;border:1px solid #34517f;border-radius:18px;padding:18px;text-align:center}
.startCard h1{font-size:32px;margin:0 0 6px}.startCard p{color:#a7b8d7;font-size:13px;line-height:1.5}
.small{font-size:11px;color:#97a9ca}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>

<div id="hud">
  <div class="hudbox">
    <span>HP <b id="hp">100/100</b></span>
    <span>LV <b id="lv">1</b></span>
    <span>XP <b id="xp">0/6</b></span>
    <span>ATK <b id="atk">10</b></span>
    <span>SHOT <b id="shot">1</b></span>
    <span>RANGE <b id="range">260</b></span>
    <span>敵 <b id="enemy">0</b> / ∞</span>
    <span>破壊 <b id="broken">0</b></span>
  </div>
  <div class="bar"><div id="hpbar"></div></div>
  <div class="bar"><div id="xpbar"></div></div>
</div>

<div id="bottom">
  <div class="panel">
    <label><span>弾速</span><b id="speedVal">6.0</b></label>
    <input id="speed" type="range" min="2" max="16" step="0.5" value="6">
    <div class="small">左側ドラッグで移動 / 自動射撃</div>
  </div>
  <button id="resetBtn">↺</button>
</div>

<div id="upgrade">
  <div class="modal">
    <h2>LEVEL UP</h2>
    <p>1つ選んで成長</p>
    <div class="choices" id="choices"></div>
  </div>
</div>

<div id="startOverlay">
  <div class="startCard">
    <h1>BREAK & GROW</h1>
    <p>ブロックを壊し、敵を倒し、強化を選び続けるローグライク。<br>プレイヤーが強くなるほど敵も進化。30WAYを取得すると超高密度モードに入り、敵が1秒に60体出現します。自分の弾と敵弾が当たると相殺できます。HP・攻撃力・サイズ・ELITE/EVOLVED率・BOSS頻度も上昇します。</p>
    <button id="startBtn">▶ はじめる</button>
  </div>
</div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=Math.min(2,devicePixelRatio||1),W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});

const world={w:3000,h:3000};
const p={x:400,y:400,r:22,hp:100,maxHp:100,lv:1,xp:0,nextXp:6,atk:10,move:3.5,bulletSpeed:6,fireRate:430,cool:0,shots:1,spread:.16,pierce:0,size:5,laser:false,laserEvery:7,shotCounter:0,regen:0,range:260};
let cam={x:0,y:0},running=false,last=0,spawnCd=0,bossCd=0,kills=0,broken=0,waveTime=0,waveCount=0;
let enemies=[],blocks=[],bullets=[],enemyBullets=[],particles=[],texts=[];
const stick={active:false,id:null,sx:0,sy:0,dx:0,dy:0};

const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d),ang=(a,b,c,d)=>Math.atan2(d-b,c-a);

function addText(x,y,t,color='#fff4a0',life=55,size=18){texts.push({x,y,t,color,life,max:life,size})}
function burst(x,y,color,n=10){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rnd(.6,3.8);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(18,36),max:36,color})}}
function blockColor(t){return t==='atk'?'#ff667a':t==='hp'?'#5aadff':t==='shot'?'#ffd55b':'#8191ac'}

function spawnEnemy(kind='normal'){
  let x,y;
  do{x=rnd(80,world.w-80);y=rnd(80,world.h-80)}while(dist(x,y,p.x,p.y)<500);
  const power=1+(p.lv-1)*0.16;
  const boss=kind==='boss', evolved=kind==='evolved', elite=kind==='elite';
  const hpBase=boss?300:evolved?90:elite?60:36;
  const baseR=boss?44:evolved?30:elite?25:22;
  const sizeScale=Math.min(2.2,1+(p.lv-1)*0.035);
  const r=baseR*sizeScale;
  const spd=(boss?.72:evolved?1.05:elite?1.2:rnd(.9,1.35))*Math.min(1.9,1+(p.lv-1)*0.055);
  const atkBase=boss?16:evolved?13:elite?11:rnd(6,10);
  enemies.push({x,y,r,hp:hpBase*power,max:hpBase*power,spd,atk:atkBase*power,cd:rnd(450,1000),boss,evolved,elite,kind,body:0,turret:0});
}
function spawnBlock(x,y,type){
  blocks.push({x,y,w:68,h:44,type,hp:type==='wall'?4:2,max:type==='wall'?4:2});
}
function initBlocks(){
  blocks=[];
  for(let gy=0;gy<7;gy++)for(let gx=0;gx<7;gx++){
    let bx=180+gx*380+rnd(-55,55),by=180+gy*380+rnd(-55,55);
    for(let r=0;r<2;r++)for(let q=0;q<3;q++){
      let roll=Math.random(),type=roll<.28?'atk':roll<.56?'hp':roll<.84?'shot':'wall';
      spawnBlock(bx+q*74,by+r*50,type);
    }
  }
}
function resetGame(){
  Object.assign(p,{x:400,y:400,hp:100,maxHp:100,lv:1,xp:0,nextXp:6,atk:10,move:3.5,bulletSpeed:parseFloat($('speed').value),fireRate:430,cool:0,shots:1,spread:.16,pierce:0,size:5,laser:false,laserEvery:7,shotCounter:0,regen:0,range:260});
  enemies=[];bullets=[];enemyBullets=[];particles=[];texts=[];kills=0;broken=0;spawnCd=0;bossCd=0;waveTime=0;waveCount=0;
  initBlocks(); for(let i=0;i<8;i++)spawnEnemy('normal'); updateHud();
}
function updateHud(){
  $('hp').textContent=Math.max(0,Math.ceil(p.hp))+'/'+p.maxHp;
  $('lv').textContent=p.lv;$('xp').textContent=p.xp+'/'+p.nextXp;$('atk').textContent=Math.round(p.atk);
  $('shot').textContent=p.laser?'LASER + '+p.shots:p.shots;$('range').textContent=Math.round(p.range);$('enemy').textContent=enemies.length;$('broken').textContent=broken;
  $('hpbar').style.width=(p.hp/p.maxHp*100)+'%';$('xpbar').style.width=(p.xp/p.nextXp*100)+'%';
}
function nearest(){let best=null,bd=1e9;for(const e of enemies){let d=dist(p.x,p.y,e.x,e.y);if(d<bd){bd=d;best=e}}return best}

function fire(){
  const e=nearest();if(!e)return;
  const base=ang(p.x,p.y,e.x,e.y);p.shotCounter++;
  const count=Math.max(1,p.shots);
  const totalSpread=Math.min(Math.PI*1.55,p.spread*(count-1));
  for(let i=0;i<count;i++){
    const a=count===1?base:base-totalSpread/2+(totalSpread*i/(count-1));
    bullets.push({x:p.x+Math.cos(a)*34,y:p.y+Math.sin(a)*34,vx:Math.cos(a)*p.bulletSpeed,vy:Math.sin(a)*p.bulletSpeed,r:p.size,d:p.atk,life:9999,pierce:p.pierce,traveled:0,maxRange:p.range});
  }
  if(p.laser && p.shotCounter%p.laserEvery===0){
    laserFire(base,e);
  }
}
function laserFire(a,target){
  const len=900,ex=p.x+Math.cos(a)*len,ey=p.y+Math.sin(a)*len;
  texts.push({laser:true,x1:p.x,y1:p.y,x2:ex,y2:ey,life:9,max:9,color:'#77f7ff'});
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const vx=e.x-p.x,vy=e.y-p.y,proj=vx*Math.cos(a)+vy*Math.sin(a);
    if(proj<0||proj>len)continue;
    const px=p.x+Math.cos(a)*proj,py=p.y+Math.sin(a)*proj;
    if(dist(px,py,e.x,e.y)<e.r+14){
      e.hp-=p.atk*2.4;burst(e.x,e.y,'#7ffcff',8);
      if(e.hp<=0)killEnemy(i);
    }
  }
}
function enemyFire(e){
  const a=ang(e.x,e.y,p.x,p.y);enemyBullets.push({x:e.x+Math.cos(a)*(e.r+8),y:e.y+Math.sin(a)*(e.r+8),vx:Math.cos(a)*3.9,vy:Math.sin(a)*3.9,r:e.boss?6:4,d:e.atk,life:220});
}

function killEnemy(i){
  const e=enemies[i];
  const col=e.boss?'#fff09c':e.evolved?'#b59cff':e.elite?'#ffb36b':'#ff8fa2';
  burst(e.x,e.y,col,e.boss?24:e.evolved?18:13);
  kills++;
  const grow=e.boss?5:e.evolved?2.2:e.elite?1.4:1;
  p.atk+=0.10*grow;p.maxHp+=0.15*grow;p.hp=Math.min(p.maxHp,p.hp+.8*grow);p.range+=e.boss?28:e.evolved?10:e.elite?5:2;
  addText(e.x,e.y-28,e.boss?'BOSS GROW +RANGE':e.evolved?'EVOLVED GROW +':e.elite?'ELITE GROW +':'ENEMY GROW +',col,48,e.boss?17:14);
  gainXp(e.boss?10:e.evolved?5:e.elite?3:2);enemies.splice(i,1);
}
function gainXp(v){
  p.xp+=v;
  if(p.xp>=p.nextXp){
    p.xp-=p.nextXp;p.lv++;p.nextXp=Math.round(p.nextXp*1.28+2);p.hp=Math.min(p.maxHp,p.hp+15);p.range+=70;
    addText(p.x,p.y-45,'RANGE +70','#9ef7ff',70,22);
    running=false;showUpgrade();
  }
}
function destroyBlock(b){
  broken++;burst(b.x+b.w/2,b.y+b.h/2,blockColor(b.type),10);
  if(b.type==='atk'){p.atk+=1.0;addText(b.x+b.w/2,b.y-8,'ATK +1','#ffb1bd',60,22)}
  else if(b.type==='hp'){p.maxHp+=4;p.hp=Math.min(p.maxHp,p.hp+8);addText(b.x+b.w/2,b.y-8,'MAX HP +4','#a8d8ff',60,22)}
  else if(b.type==='shot'){p.fireRate=Math.max(120,p.fireRate-8);addText(b.x+b.w/2,b.y-8,'FIRE RATE +','#fff0a0',60,22)}
  blocks.splice(blocks.indexOf(b),1);
}

const upgrades=[
  {name:'3WAY',desc:'弾を3発同時に発射',apply:()=>p.shots=Math.max(p.shots,3)},
  {name:'5WAY',desc:'弾を5発同時に発射',apply:()=>p.shots=Math.max(p.shots,5)},
  {name:'12WAY',desc:'弾幕化。12発同時発射',apply:()=>p.shots=Math.max(p.shots,12)},
  {name:'30WAY',desc:'画面を埋める30発同時発射',apply:()=>p.shots=Math.max(p.shots,30)},
  {name:'LASER',desc:'数回に1回、貫通ビームを発射',apply:()=>p.laser=true},
  {name:'LASER RAPID',desc:'レーザー発射間隔を短縮',apply:()=>{p.laser=true;p.laserEvery=Math.max(2,p.laserEvery-2)}},
  {name:'PIERCE',desc:'弾が敵を1体貫通',apply:()=>p.pierce++},
  {name:'BIG BULLET',desc:'弾サイズと威力アップ',apply:()=>{p.size=Math.min(14,p.size+2);p.atk+=2}},
  {name:'RAPID FIRE',desc:'連射速度アップ',apply:()=>p.fireRate=Math.max(110,p.fireRate*.78)},
  {name:'BULLET SPEED',desc:'弾速を大幅アップ',apply:()=>p.bulletSpeed+=2},
  {name:'RANGE UP',desc:'射程 +180。もっと遠くまで届く',apply:()=>p.range+=180},
  {name:'POWER',desc:'攻撃力 +35%',apply:()=>p.atk*=1.35},
  {name:'MAX HP',desc:'最大HP +30 / 30回復',apply:()=>{p.maxHp+=30;p.hp=Math.min(p.maxHp,p.hp+30)}},
  {name:'REGEN',desc:'毎秒HP回復',apply:()=>p.regen+=1.2},
  {name:'TANK SPEED',desc:'移動速度アップ',apply:()=>p.move+=.7},
  {name:'WIDE SPREAD',desc:'弾の広がりを拡大',apply:()=>p.spread=Math.min(.34,p.spread+.04)}
];
function getChoices(){
  let pool=upgrades.slice();
  if(p.shots<3)pool.unshift(upgrades[0]);
  else if(p.shots<5)pool.unshift(upgrades[1]);
  else if(p.shots<12)pool.unshift(upgrades[2]);
  else if(p.shots<30)pool.unshift(upgrades[3]);
  if(!p.laser&&p.lv>=4)pool.unshift(upgrades[4]);
  const out=[];while(out.length<3&&pool.length){let i=Math.floor(Math.random()*pool.length);let u=pool.splice(i,1)[0];if(!out.includes(u))out.push(u)}
  return out;
}
function showUpgrade(){
  $('choices').innerHTML='';for(const u of getChoices()){const b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+u.name+'</b><span>'+u.desc+'</span>';b.onclick=()=>{u.apply();$('upgrade').classList.remove('show');running=true;updateHud()};$('choices').appendChild(b)}
  $('upgrade').classList.add('show');updateHud();
}

function update(dt){
  if(!running)return;
  if(p.regen>0)p.hp=Math.min(p.maxHp,p.hp+p.regen*dt/1000);
  let mx=stick.dx,my=stick.dy,l=Math.hypot(mx,my);if(l>.04){mx/=l;my/=l;p.x+=mx*p.move*dt*.065;p.y+=my*p.move*dt*.065}
  p.x=clamp(p.x,20,world.w-20);p.y=clamp(p.y,20,world.h-20);
  p.cool-=dt;if(p.cool<=0){fire();p.cool=p.fireRate}
  if(p.shots>=30){
    // 30WAY到達後は超高密度モード：1秒に60体
    spawnCd-=dt;
    while(spawnCd<=0){
      const roll=Math.random();
      let kind='normal';
      const evolvedChance=Math.min(0.40,0.08+p.lv*0.02);
      const eliteChance=Math.min(0.58,0.20+p.lv*0.024);
      if(p.lv>=4&&roll<evolvedChance)kind='evolved';
      else if(p.lv>=2&&roll<eliteChance)kind='elite';
      spawnEnemy(kind);
      spawnCd+=1000/60;
    }
    bossCd-=dt;
    if(bossCd<=0&&!enemies.some(e=>e.boss)){
      spawnEnemy('boss');
      bossCd=8000;
    }
  }else{
    waveTime+=dt;
    const waveInterval=Math.max(1200,10000-p.lv*420);
    const waveSize=Math.min(60,10+Math.floor((p.lv-1)*2.5));
    if(waveTime>=waveInterval){
      waveTime-=waveInterval;waveCount++;
      for(let s=0;s<waveSize;s++){
        const roll=Math.random();
        let kind='normal';
        const evolvedChance=Math.min(0.34,0.05+p.lv*0.018);
        const eliteChance=Math.min(0.50,0.16+p.lv*0.022);
        if(p.lv>=4&&roll<evolvedChance)kind='evolved';
        else if(p.lv>=2&&roll<eliteChance)kind='elite';
        spawnEnemy(kind);
      }
      const bossEvery=Math.max(2,6-Math.floor(p.lv/6));
      if(waveCount%bossEvery===0&&!enemies.some(e=>e.boss))spawnEnemy('boss');
    }
  }
  for(const e of enemies){
    const a=ang(e.x,e.y,p.x,p.y),d=dist(e.x,e.y,p.x,p.y);e.turret=a;
    if(d>(e.boss?230:160)){e.x+=Math.cos(a)*e.spd*dt*.05;e.y+=Math.sin(a)*e.spd*dt*.05}
    e.cd-=dt;if(e.cd<=0&&d<(e.boss?750:540)){enemyFire(e);e.cd=(e.boss?440:1000)+Math.random()*350}
  }
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];const step=Math.hypot(b.vx,b.vy)*dt*.06;b.x+=b.vx*dt*.06;b.y+=b.vy*dt*.06;b.traveled+=step;if(b.traveled>=b.maxRange||--b.life<=0){bullets.splice(i,1);continue}
    let gone=false;
    for(const bl of blocks){if(b.x>bl.x&&b.x<bl.x+bl.w&&b.y>bl.y&&b.y<bl.y+bl.h){bl.hp--;burst(b.x,b.y,blockColor(bl.type),5);if(bl.hp<=0)destroyBlock(bl);bullets.splice(i,1);gone=true;break}}
    if(gone)continue;
    for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(dist(b.x,b.y,e.x,e.y)<b.r+e.r){e.hp-=b.d;burst(b.x,b.y,'#ffd0da',5);addText(e.x,e.y-22,'-'+Math.round(b.d),'#ffd0da',30,13);if(e.hp<=0)killEnemy(j);if(b.pierce>0)b.pierce--;else{bullets.splice(i,1);gone=true}break}}
  }
  // Player bullets can cancel enemy bullets on contact.
  for(let i=enemyBullets.length-1;i>=0;i--){
    const eb=enemyBullets[i];
    let cancelled=false;
    for(let j=bullets.length-1;j>=0;j--){
      const pb=bullets[j];
      if(dist(eb.x,eb.y,pb.x,pb.y)<eb.r+pb.r){
        burst((eb.x+pb.x)/2,(eb.y+pb.y)/2,'#d7f7ff',7);
        addText((eb.x+pb.x)/2,(eb.y+pb.y)/2-10,'BLOCK','#d7f7ff',24,11);
        enemyBullets.splice(i,1);
        bullets.splice(j,1);
        cancelled=true;
        break;
      }
    }
    if(cancelled)continue;
  }

  for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.x+=b.vx*dt*.06;b.y+=b.vy*dt*.06;if(--b.life<=0){enemyBullets.splice(i,1);continue}
    if(dist(b.x,b.y,p.x,p.y)<b.r+p.r){p.hp-=b.d;burst(b.x,b.y,'#9fd4ff',6);enemyBullets.splice(i,1);if(p.hp<=0){p.hp=0;running=false;$('startOverlay').style.display='flex';$('startBtn').textContent='GAME OVER - もう一度';}continue}
  }
  for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.98;q.vy*=.98;if(--q.life<=0)particles.splice(i,1)}
  for(let i=texts.length-1;i>=0;i--){let t=texts[i];if(!t.laser)t.y-=.45;if(--t.life<=0)texts.splice(i,1)}
  cam.x=clamp(p.x-W/2,0,world.w-W);cam.y=clamp(p.y-H/2,0,world.h-H);updateHud();
}

function tank(x,y,r,color1,color2,angle=0){
  ctx.save();ctx.translate(x-cam.x,y-cam.y);ctx.rotate(angle);
  ctx.fillStyle='#314058';round(-r*1.05,-r*.7,r*2.1,r*1.4,10);
  ctx.fillStyle=color1;round(-r*.88,-r*.46,r*1.76,r*.92,9);
  ctx.fillStyle=color2;round(-r*.35,-r*.68,r*.8,r*.58,8);
  ctx.restore();
}
function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill()}
function draw(){
  ctx.fillStyle='#07111d';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(100,150,220,.08)';
  for(let gx=-cam.x%100;gx<W;gx+=100){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}
  for(let gy=-cam.y%100;gy<H;gy+=100){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const b of blocks){let x=b.x-cam.x,y=b.y-cam.y;if(x<-90||y<-90||x>W+90||y>H+90)continue;ctx.fillStyle=blockColor(b.type);round(x,y,b.w,b.h,7);ctx.fillStyle='#111827';ctx.fillText(b.type==='wall'?'WALL':b.type.toUpperCase(),x+b.w/2,y+b.h/2)}
  for(const e of enemies){
    const c1=e.boss?'#f1ca66':e.evolved?'#9c7dff':e.elite?'#ff9d55':'#ff748c';
    const c2=e.boss?'#ffe8a1':e.evolved?'#d2c5ff':e.elite?'#ffd0a8':'#ffc2cd';
    tank(e.x,e.y,e.r,c1,c2);
    let x=e.x-cam.x,y=e.y-cam.y-e.r-12;ctx.fillStyle='#0a101b';ctx.fillRect(x-23,y,46,5);ctx.fillStyle=e.boss?'#ffd457':e.evolved?'#a98cff':e.elite?'#ff9e56':'#ff6b81';ctx.fillRect(x-23,y,46*Math.max(0,e.hp/e.max),5);
    if(e.boss||e.evolved||e.elite){ctx.fillStyle=c2;ctx.font='bold 10px sans-serif';ctx.fillText(e.boss?'BOSS':e.evolved?'EVOLVED':'ELITE',x,y-8)}
  }
  ctx.fillStyle='#e9fbff';for(const b of bullets){ctx.beginPath();ctx.arc(b.x-cam.x,b.y-cam.y,b.r,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#ffb9c6';for(const b of enemyBullets){ctx.beginPath();ctx.arc(b.x-cam.x,b.y-cam.y,b.r,0,Math.PI*2);ctx.fill()}
  tank(p.x,p.y,p.r,'#59d885','#9cffb8');
  for(const q of particles){ctx.fillStyle=q.color;ctx.fillRect(q.x-cam.x,q.y-cam.y,3,3)}
  for(const t of texts){
    if(t.laser){ctx.save();ctx.globalAlpha=t.life/t.max;ctx.strokeStyle=t.color;ctx.lineWidth=8;ctx.shadowColor=t.color;ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(t.x1-cam.x,t.y1-cam.y);ctx.lineTo(t.x2-cam.x,t.y2-cam.y);ctx.stroke();ctx.restore()}
    else{ctx.save();ctx.globalAlpha=t.life/t.max;ctx.fillStyle=t.color;ctx.font='bold '+t.size+'px sans-serif';ctx.textAlign='center';ctx.fillText(t.t,t.x-cam.x,t.y-cam.y);ctx.restore()}
  }
  ctx.fillStyle='rgba(20,35,61,.72)';ctx.beginPath();ctx.arc(72,H-110,58,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#35517e';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#d8e6ff';ctx.beginPath();ctx.arc(72+stick.dx*33,H-110+stick.dy*33,10,0,Math.PI*2);ctx.fill();
}

function loop(t){if(!last)last=t;const dt=Math.min(34,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{e.preventDefault();const q=pos(e);if(q.x<W*.55&&q.y>H*.45){stick.active=true;stick.id=e.pointerId;stick.sx=q.x;stick.sy=q.y;stick.dx=stick.dy=0;c.setPointerCapture(e.pointerId)}})
c.addEventListener('pointermove',e=>{e.preventDefault();if(!stick.active||stick.id!==e.pointerId)return;const q=pos(e),m=48;let dx=q.x-stick.sx,dy=q.y-stick.sy,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}stick.dx=dx/m;stick.dy=dy/m})
function clearStick(e){e.preventDefault();if(stick.id===e.pointerId){stick.active=false;stick.id=null;stick.dx=stick.dy=0}}
c.addEventListener('pointerup',clearStick);c.addEventListener('pointercancel',clearStick);

$('speed').oninput=()=>{p.bulletSpeed=parseFloat($('speed').value);$('speedVal').textContent=p.bulletSpeed.toFixed(1)}
$('resetBtn').onclick=()=>{resetGame();running=true}
$('startBtn').onclick=()=>{resetGame();$('startOverlay').style.display='none';running=true}
resetGame();updateHud();requestAnimationFrame(loop);
</script>
</body>
