<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BREAK & GROW</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#07101c;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body{padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:auto}
h1{margin:0;font-size:30px}.sub{color:#9aabd0;font-size:13px;margin:3px 0 8px}
.card{background:#111a2d;border:1px solid #27395f;border-radius:18px;padding:10px}
canvas{width:100%;aspect-ratio:3/4;display:block;border-radius:14px;background:#08111d;touch-action:none}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button{border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;color:white;background:#31446f}
button.primary{background:#2d9258}
.rangebox{margin-top:10px;background:#0a1324;border:1px solid #223457;border-radius:12px;padding:10px}
.rangebox label{display:flex;justify-content:space-between;font-size:13px;color:#c8d6f4}
input[type=range]{width:100%;margin-top:8px}
.note{font-size:12px;color:#93a4c9;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>BREAK & GROW</h1>
  <div class="sub">タンクを指で動かし、敵とブロックを撃ってレベルアップ</div>
  <div class="card">
    <canvas id="game" width="900" height="1200"></canvas>
    <div class="controls">
      <button class="primary" id="start">▶ はじめる / 再開</button>
      <button id="reset">↺ 最初から</button>
    </div>
    <div class="rangebox">
      <label><span>弾の速さ</span><b id="speedVal">6.0</b></label>
      <input id="speed" type="range" min="2" max="14" step="0.5" value="6">
    </div>
    <div class="note">左下をドラッグして移動。弾は自動発射。近い敵を自動で狙います。敵撃破でXP、レベル5でボス出現。</div>
  </div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;
const start=document.getElementById('start'),reset=document.getElementById('reset'),speed=document.getElementById('speed'),speedVal=document.getElementById('speedVal');
const world={w:2600,h:2200}; let cam={x:0,y:0},running=false,last=0,boss=false,won=false,over=false;
const p={x:260,y:260,r:24,hp:100,max:100,lv:1,xp:0,next:5,atk:12,bs:6,rate:420,cd:0,move:3.6,body:0,turret:0};
let bullets=[],ebullets=[],enemies=[],blocks=[],parts=[],texts=[];
const stick={active:false,id:null,sx:0,sy:0,dx:0,dy:0};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),D=(a,b,c,d)=>Math.hypot(a-c,b-d),A=(a,b,c,d)=>Math.atan2(d-b,c-a);
function rr(cx,cy,w,h,r,fill,stroke){x.beginPath();x.moveTo(cx+r,cy);x.arcTo(cx+w,cy,cx+w,cy+h,r);x.arcTo(cx+w,cy+h,cx,cy+h,r);x.arcTo(cx,cy+h,cx,cy,r);x.arcTo(cx,cy,cx+w,cy,r);x.closePath();if(fill)x.fill();if(stroke)x.stroke()}
function burst(px,py,color,n=10){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=rnd(.8,4);parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(18,36),color})}}
function text(px,py,t,color='#fff4a0'){texts.push({x:px,y:py,t,color,life:42})}
function addEnemy(isBoss=false){let ex,ey;do{ex=rnd(100,world.w-100);ey=rnd(100,world.h-100)}while(D(ex,ey,p.x,p.y)<450);enemies.push({x:ex,y:ey,r:isBoss?44:23,hp:isBoss?260:42,max:isBoss?260:42,spd:isBoss?.65:rnd(.9,1.35),atk:isBoss?16:rnd(7,10),cd:rnd(600,1200),boss:isBoss,body:0,turret:0})}
function init(){
  bullets=[];ebullets=[];enemies=[];blocks=[];parts=[];texts=[];boss=false;won=false;over=false;
  Object.assign(p,{x:260,y:260,hp:100,max:100,lv:1,xp:0,next:5,atk:12,rate:420,cd:0,move:3.6,body:0,turret:0});
  p.bs=parseFloat(speed.value);
  for(let gy=0;gy<6;gy++)for(let gx=0;gx<7;gx++){let bx=250+gx*320+rnd(-40,40),by=220+gy*300+rnd(-40,40);for(let r=0;r<2;r++)for(let q=0;q<3;q++){let types=['atk','hp','spd','steel'];let type=types[Math.floor(Math.random()*(Math.random()<.18?4:3))];blocks.push({x:bx+q*78,y:by+r*56,w:70,h:48,type,hp:type==='steel'?4:2,max:type==='steel'?4:2})}}
  for(let i=0;i<10;i++)addEnemy(false); center();
}
function center(){cam.x=clamp(p.x-W/2,0,world.w-W);cam.y=clamp(p.y-H/2,0,world.h-H)}
function nearest(){let best=null,bd=1e9;for(const e of enemies){let d=D(p.x,p.y,e.x,e.y);if(d<bd){bd=d;best=e}}return best}
function playerShot(){let e=nearest(),a=e?A(p.x,p.y,e.x,e.y):p.turret;p.turret=a;bullets.push({x:p.x+Math.cos(a)*38,y:p.y+Math.sin(a)*38,vx:Math.cos(a)*p.bs,vy:Math.sin(a)*p.bs,r:5,d:p.atk,life:180})}
function enemyShot(e){let a=A(e.x,e.y,p.x,p.y);ebullets.push({x:e.x+Math.cos(a)*(e.r+8),y:e.y+Math.sin(a)*(e.r+8),vx:Math.cos(a)*4,vy:Math.sin(a)*4,r:e.boss?6:4,d:e.atk,life:180})}
function gain(v){p.xp+=v;if(p.xp>=p.next){p.lv++;p.xp=0;p.next=Math.round(p.next*1.5+1);p.max+=10;p.hp=Math.min(p.max,p.hp+20);p.atk+=3;p.rate=Math.max(180,p.rate-25);p.move+=.08;text(p.x,p.y-34,'LEVEL UP!');burst(p.x,p.y,'#fff29a',20);if(p.lv>=5&&!boss){boss=true;addEnemy(true)}}}
function blockColor(t){return t==='atk'?'#ff687c':t==='hp'?'#5ab0ff':t==='spd'?'#ffd75d':'#8393ad'}
function blockHit(b,player=true){b.hp--;burst(b.x+b.w/2,b.y+b.h/2,blockColor(b.type),7);if(b.hp<=0){if(player){if(b.type==='atk')p.atk+=.25;if(b.type==='hp')p.hp=Math.min(p.max,p.hp+2);if(b.type==='spd')p.bs+=.03}blocks.splice(blocks.indexOf(b),1)}}
function update(dt){
  if(!running||won||over)return;
  let mx=stick.dx,my=stick.dy,l=Math.hypot(mx,my);if(l>.05){mx/=l;my/=l;p.x+=mx*p.move*dt*.06;p.y+=my*p.move*dt*.06;p.body=Math.atan2(my,mx)}
  p.x=clamp(p.x,20,world.w-20);p.y=clamp(p.y,20,world.h-20);
  let ne=nearest();if(ne)p.turret=A(p.x,p.y,ne.x,ne.y);
  p.cd-=dt;if(p.cd<=0){playerShot();p.cd=p.rate}
  for(const e of enemies){let a=A(e.x,e.y,p.x,p.y),d=D(e.x,e.y,p.x,p.y);e.turret=a;if(d>(e.boss?230:170)){e.x+=Math.cos(a)*e.spd*dt*.05;e.y+=Math.sin(a)*e.spd*dt*.05;e.body=a}e.cd-=dt;if(e.cd<=0&&d<(e.boss?700:520)){enemyShot(e);e.cd=(e.boss?430:1050)+Math.random()*350}}
  for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt*.06;b.y+=b.vy*dt*.06;b.life--;if(b.life<0){bullets.splice(i,1);continue}let hit=false;for(const bl of blocks){if(b.x>bl.x&&b.x<bl.x+bl.w&&b.y>bl.y&&b.y<bl.y+bl.h){blockHit(bl,true);bullets.splice(i,1);hit=true;break}}if(hit)continue;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(D(b.x,b.y,e.x,e.y)<e.r+b.r){e.hp-=b.d;burst(b.x,b.y,'#ffd0d8',6);text(e.x,e.y-25,'-'+Math.round(b.d),'#ffd0d8');bullets.splice(i,1);if(e.hp<=0){burst(e.x,e.y,e.boss?'#fff09c':'#ff8ea0',e.boss?24:14);gain(e.boss?10:2);if(e.boss){won=true;running=false}enemies.splice(j,1)}break}}}
  for(let i=ebullets.length-1;i>=0;i--){let b=ebullets[i];b.x+=b.vx*dt*.06;b.y+=b.vy*dt*.06;b.life--;if(b.life<0){ebullets.splice(i,1);continue}let hit=false;for(const bl of blocks){if(b.x>bl.x&&b.x<bl.x+bl.w&&b.y>bl.y&&b.y<bl.y+bl.h){blockHit(bl,false);ebullets.splice(i,1);hit=true;break}}if(hit)continue;if(D(b.x,b.y,p.x,p.y)<p.r+b.r){p.hp-=b.d;burst(b.x,b.y,'#a7d9ff',7);ebullets.splice(i,1);if(p.hp<=0){p.hp=0;over=true;running=false}}}
  for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.98;q.vy*=.98;if(--q.life<=0)parts.splice(i,1)}
  for(let i=texts.length-1;i>=0;i--){texts[i].y-=.5;if(--texts[i].life<=0)texts.splice(i,1)}
  center();
}
function tank(px,py,r,ba,ta,c1,c2,boss=false){x.save();x.translate(px-cam.x,py-cam.y);x.save();x.rotate(ba);x.fillStyle='#324155';rr(-r*1.05,-r*.72,r*2.1,r*1.44,11,true);x.fillStyle=c1;rr(-r*.9,-r*.48,r*1.8,r*.96,9,true);x.fillStyle=c2;rr(-r*.65,-r*.7,r,r*.65,9,true);x.restore();x.save();x.rotate(ta);x.fillStyle=c2;rr(0,-r*.14,r*1.25+(boss?18:0),r*.28,4,true);x.restore();x.restore()}
function draw(){
  x.fillStyle='#08111d';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(100,150,220,.08)';for(let gx=-cam.x%120;gx<W;gx+=120){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(let gy=-cam.y%120;gy<H;gy+=120){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
  x.font='bold 14px sans-serif';x.textAlign='center';x.textBaseline='middle';
  for(const b of blocks){let bx=b.x-cam.x,by=b.y-cam.y;if(bx<-100||by<-100||bx>W+100||by>H+100)continue;x.fillStyle=blockColor(b.type);rr(bx,by,b.w,b.h,8,true);x.fillStyle='#111827';x.fillText(b.type==='steel'?'WALL':b.type.toUpperCase(),bx+b.w/2,by+b.h/2)}
  for(const e of enemies){tank(e.x,e.y,e.r,e.body,e.turret,e.boss?'#f0c867':'#ff748b',e.boss?'#ffe69c':'#ffc2cc',e.boss);let ex=e.x-cam.x,ey=e.y-cam.y-e.r-15;x.fillStyle='#080d17';rr(ex-26,ey,52,7,4,true);x.fillStyle=e.boss?'#ffd75d':'#ff7389';rr(ex-26,ey,52*(e.hp/e.max),7,4,true)}
  x.fillStyle='#e8fbff';for(const b of bullets){x.beginPath();x.arc(b.x-cam.x,b.y-cam.y,b.r,0,6.28);x.fill()}
  x.fillStyle='#ffb6c4';for(const b of ebullets){x.beginPath();x.arc(b.x-cam.x,b.y-cam.y,b.r,0,6.28);x.fill()}
  tank(p.x,p.y,p.r,p.body,p.turret,'#58d986','#9dffba');
  for(const q of parts){x.fillStyle=q.color;x.fillRect(q.x-cam.x,q.y-cam.y,3,3)}
  x.font='bold 17px sans-serif';for(const t of texts){x.fillStyle=t.color;x.fillText(t.t,t.x-cam.x,t.y-cam.y)}
  x.textAlign='left';x.fillStyle='rgba(4,9,17,.76)';rr(12,12,430,82,12,true);x.fillStyle='#eef4ff';x.font='bold 18px sans-serif';x.fillText('HP '+Math.ceil(p.hp)+'/'+p.max+'   LV '+p.lv+'   XP '+p.xp+'/'+p.next,28,42);x.font='15px sans-serif';x.fillText('ATK '+Math.round(p.atk)+'   弾速 '+p.bs.toFixed(1)+'   敵 '+enemies.length+'   BLOCK '+blocks.length,28,70);
  x.fillStyle='#16233d';rr(28,H-150,120,120,60,true);x.strokeStyle='#385176';x.lineWidth=3;x.stroke();x.fillStyle='#d6e4ff';x.beginPath();x.arc(88+stick.dx*36,H-90+stick.dy*36,12,0,6.28);x.fill();
  if(!running){x.fillStyle='rgba(5,9,18,.68)';rr(W/2-210,H/2-70,420,140,16,true);x.textAlign='center';x.fillStyle='#fff';x.font='bold 34px sans-serif';x.fillText(won?'STAGE CLEAR!':over?'GAME OVER':'READY',W/2,H/2-10);x.font='16px sans-serif';x.fillStyle='#c5d2ec';x.fillText(won?'ボス撃破！':over?'最初からで再挑戦':'はじめる / 再開 を押す',W/2,H/2+28)}
}
function loop(t){if(!last)last=t;let dt=Math.min(33,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{let q=pos(e);if(q.x<W*.48&&q.y>H*.5){stick.active=true;stick.id=e.pointerId;stick.sx=q.x;stick.sy=q.y;stick.dx=stick.dy=0;c.setPointerCapture(e.pointerId)}})
c.addEventListener('pointermove',e=>{if(!stick.active||stick.id!==e.pointerId)return;let q=pos(e),dx=q.x-stick.sx,dy=q.y-stick.sy,m=48,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}stick.dx=dx/m;stick.dy=dy/m})
function clear(e){if(stick.id===e.pointerId){stick.active=false;stick.id=null;stick.dx=stick.dy=0}}
c.addEventListener('pointerup',clear);c.addEventListener('pointercancel',clear);
start.onclick=()=>{if(over||won)init();running=true};reset.onclick=()=>{init();running=false};
speed.oninput=()=>{p.bs=parseFloat(speed.value);speedVal.textContent=p.bs.toFixed(1)};
init();running=false;requestAnimationFrame(loop);
</script>
</body>
</html>
